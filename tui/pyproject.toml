[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker-tui"
version = "1.0.0"
description = "Terminal UI (Textual) for the Expense Tracker backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
expense-tracker-tui = "expense_tracker_tui.app:main"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["expense_tracker_tui*"]
